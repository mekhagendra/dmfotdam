# =============================================================================
# TDM – Nginx site configuration
# Placeholder __SERVER_NAME__ and __APP_ROOT__ are replaced by vultr-deploy.sh
# For manual install, replace them with your domain/IP and /opt/tdm
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Upstream backend
upstream tdm_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP – redirect to HTTPS
server {
    listen [::]:80;
    server_name tdmapp.v6.rocks;

    # Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS – primary server block
# certbot will automatically insert ssl_certificate / ssl_certificate_key lines
server {
    listen [::]:443 ssl;
    http2 on;
    server_name tdmapp.v6.rocks;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options     "nosniff"                       always;
    add_header X-XSS-Protection           "1; mode=block"                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline' https://accounts.google.com; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com; \
         img-src 'self' data: https:; \
         connect-src 'self' wss: https://accounts.google.com; \
         frame-src https://accounts.google.com;" always;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── Static frontend files ───────────────────────────────────────────────
    root __APP_ROOT__/frontend/build;
    index index.html;

    # Long-cache immutable hashed assets (CRA puts them in /static/)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # manifest / robots / favicon – short cache
    location ~* \.(ico|manifest\.json|robots\.txt)$ {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── WebSocket – live monitoring (/api/v1/live/*) ────────────────────────
    location /api/v1/live/ {
        proxy_pass         http://tdm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── REST API (/api/*) ───────────────────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass          http://tdm_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection         "";
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
        proxy_read_timeout  60s;
        client_max_body_size 1m;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass          http://tdm_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection         "";
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        # Allow large file uploads (50 MB)
        client_max_body_size 55m;
    }

    # Direct health-check (bypasses rate limiting)
    location = /health {
        proxy_pass         http://tdm_backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log off;
    }

    # ── SPA fallback – serve index.html for all unknown routes ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
