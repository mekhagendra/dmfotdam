# Streamlit Secrets Configuration
# 
# IMPORTANT: This file should NOT be committed to git.
# Add it to .gitignore and keep it local.
#
# On Streamlit Cloud, add these secrets via:
# App Dashboard → Manage app → Secrets tab
#
# For local development, fill in your credentials below and save as:
# .streamlit/secrets.toml

# ============================================================================
# Application Settings
# ============================================================================

[app]
debug = false
# Set to true for verbose logging and debug panels

# ============================================================================
# Database Configuration (Optional)
# ============================================================================

[database]
# MongoDB connection string
# Format: mongodb+srv://username:password@cluster.mongodb.net/dbname
url = "mongodb+srv://user:password@cluster.mongodb.net/tdm"

# Database name (if different from URL path)
name = "tdm"

# ============================================================================
# API Configuration (Optional)
# ============================================================================

[api]
# Backend API base URL (if running FastAPI separately)
base_url = "http://localhost:8080"

# API key for authenticated requests (if applicable)
# key = "your-api-key-here"

# ============================================================================
# Model Configuration (Optional)
# ============================================================================

[models]
# Path to models directory
# Local: backend/data/models
# Cloud storage: s3://bucket/models or gs://bucket/models
path = "backend/data/models"

# ============================================================================
# User Configuration (Optional)
# ============================================================================

[user]
# Seed admin user for first login
seed_admin = "admin"

# ============================================================================
# Logging
# ============================================================================

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"
