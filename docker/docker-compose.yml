version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tdm_db
      POSTGRES_USER: tdm_user
      POSTGRES_PASSWORD: tdm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tdm-network

  # Redis for caching and background tasks
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - tdm-network

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql://tdm_user:tdm_password@postgres:5432/tdm_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - upload_data:/app/data/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - tdm-network

  # Frontend React App
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - tdm-network

  # Celery Worker for background tasks
  celery-worker:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    command: celery -A app.core.celery worker --loglevel=info
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql://tdm_user:tdm_password@postgres:5432/tdm_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../backend:/app
      - upload_data:/app/data/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - tdm-network

  # Nginx for reverse proxy (production)
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../docker/nginx.conf:/etc/nginx/nginx.conf
      - ../docker/ssl:/etc/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - tdm-network
    profiles:
      - production

volumes:
  postgres_data:
  upload_data:

networks:
  tdm-network:
    driver: bridge